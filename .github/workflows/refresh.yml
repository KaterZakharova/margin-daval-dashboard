name: Daily refresh + publish to hub-stm (Coolify)

on:
  schedule:
    - cron: '45 5 * * 1-5'   # 08:45 МСК (UTC+3), пн–пт
  workflow_dispatch:          # ручной запуск из Actions UI или из кнопки на дашборде

permissions:
  contents: write              # для push data.json в этот репо

jobs:
  # ────────────────────────────────────────────────────────
  # JOB 1: обновить data.json из MSSQL + 1С OData и запушить сюда (в margin-daval-dashboard)
  # ────────────────────────────────────────────────────────
  refresh:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - name: Checkout margin-daval-dashboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # полный history — чтобы git видел актуальный blob для diff

      - name: Refresh data.json
        shell: pwsh
        env:
          SQL_CONN:  ${{ secrets.SQL_CONN }}
          ODATA_URL: ${{ secrets.ODATA_URL }}
          ODATA_KEY: ${{ secrets.ODATA_KEY }}
          OUT_DIR:   ${{ github.workspace }}
        run: scripts/refresh_data.ps1

      - name: Commit & push data.json
        id: commit
        shell: pwsh
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data.json
          # Диагностика — что именно git видит
          Write-Host "----- git status -----"
          git status --porcelain data.json
          Write-Host "----- git diff --staged --stat -----"
          git diff --staged --stat data.json
          $changed = (git status --porcelain data.json)
          if ($changed) {
            git commit -m "chore: refresh data $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"
            git push
            "committed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "OK: data.json committed and pushed"
          } else {
            "committed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "SKIP: data.json без изменений (SQL/OData вернули идентичные данные)"
          }

  # ────────────────────────────────────────────────────────
  # JOB 2: перекопировать свежий data.json + index.html в hub-stm (Coolify rebuild).
  # Запускается только если refresh реально закоммитил новые данные.
  # Отдельный job — чтобы падение hub-stm push (SSH ключ и т.п.) не помечало refresh failed.
  # ────────────────────────────────────────────────────────
  publish-hub:
    needs: refresh
    runs-on: ubuntu-latest
    if: ${{ needs.refresh.result == 'success' && needs.refresh.outputs.committed == 'true' }}
    timeout-minutes: 10

    steps:
      - name: Checkout margin-daval-dashboard (fresh data.json)
        uses: actions/checkout@v4
        with:
          path: margin

      - name: Checkout hub-stm (PAT)
        uses: actions/checkout@v4
        with:
          repository: GSS-AI-Native/hub-stm
          token: ${{ secrets.HUB_STM_PAT }}
          path: hub
          ref: main

      - name: Sync margin files into hub-stm
        run: |
          dst="hub/hub-v2/public/margin-dashboard"
          mkdir -p "$dst"
          cp -f margin/data.json  "$dst/data.json"
          cp -f margin/index.html "$dst/index.html"

      - name: Commit & push hub-stm (Coolify rebuild)
        working-directory: hub
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add hub-v2/public/margin-dashboard/data.json hub-v2/public/margin-dashboard/index.html
          if git diff --staged --quiet; then
            echo "hub-stm: margin-dashboard файлы не изменились"
          else
            git commit -m "hub-v2/margin-dashboard: auto refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push origin main
            echo "OK: pushed hub-stm — Coolify пересоберёт прод (~5 мин)"
          fi
